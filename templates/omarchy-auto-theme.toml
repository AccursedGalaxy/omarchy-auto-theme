# Matugen config owned by omarchy-auto-theme.
# Installed to ~/.config/matugen/omarchy-auto-theme.toml and invoked by
# omarchy-matugen-sync. Add your own [templates.*] blocks below to render
# extra apps from the same palette; the installer and uninstaller leave a
# modified copy of this file alone.

[config]

[templates.omarchy_quattro]
input_path  = '~/.config/matugen/templates/omarchy-quattro-colors.toml'
output_path = '~/.config/omarchy/themes/matugen-auto/colors.toml'

# Optional: adaptive tmux status bar colors. Uncomment after installing the
# extras/tmux-colors.conf.template (see README) and adding
#   source-file -q ~/.config/matugen/generated/tmux-colors.conf
# to your tmux.conf. No post_hook: the omarchy-theme-set-tmux shim (extras)
# re-sources the generated file into the running server on every theme
# change. If you skip the shim, reload with a post_hook of
# `tmux source-file ...`. Never hook `pkill` at shells here: a signal
# broadcast can kill processes that have no handler installed (a zsh parked
# on `tmux attach` in .zshrc takes its whole terminal window down with it).
#
# [templates.tmux]
# input_path  = '~/.config/matugen/templates/tmux-colors.conf'
# output_path = '~/.config/matugen/generated/tmux-colors.conf'
